/* === CINEMATIC PRELOADER — NGUYỄN PHƯƠNG ĐẠI IT === */
.npd-preloader{--pl-bg-1:#050816;--pl-bg-2:#0B1120;--pl-primary:#2563EB;--pl-secondary:#06B6D4;--pl-accent:#38BDF8;--pl-text:#FFFFFF;--pl-muted:#94A3B8;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,rgba(37,99,235,.16) 0%,rgba(6,182,212,.06) 36%,transparent 72%),linear-gradient(160deg,var(--pl-bg-1) 0%,var(--pl-bg-2) 100%);color:var(--pl-text);font-family:var(--font-sans);overflow:hidden;user-select:none;-webkit-user-select:none;isolation:isolate;will-change:transform,opacity;transition:transform .9s cubic-bezier(.76,0,.24,1),opacity .65s cubic-bezier(.22,1,.36,1),visibility 0s linear .95s}
html:not(.js) .npd-preloader,html.reveal-fallback .npd-preloader{display:none !important}
html.is-preloading,html.is-preloading body{overflow:hidden !important}
.npd-preloader.is-complete .npd-pl-logo-box{transform:scale(1.06);filter:drop-shadow(0 0 38px rgba(56,189,248,.92))}
.npd-preloader.is-complete .npd-pl-progress-fill{box-shadow:0 0 26px rgba(56,189,248,.95),0 0 48px rgba(6,182,212,.6)}
.npd-preloader.is-exiting{transform:translate3d(0,-102%,0);opacity:0;visibility:hidden;pointer-events:none}
.npd-preloader::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--pl-primary),var(--pl-secondary),var(--pl-accent),transparent);box-shadow:0 0 24px var(--pl-accent);opacity:.85}
.npd-pl-grid{position:absolute;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(56,189,248,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.055) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(circle at 50% 48%,#000 18%,transparent 74%);mask-image:radial-gradient(circle at 50% 48%,#000 18%,transparent 74%)}
.npd-pl-glow{position:absolute;width:min(540px,88vw);height:min(540px,88vw);border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.22) 0%,rgba(6,182,212,.11) 42%,transparent 70%);filter:blur(48px);pointer-events:none;z-index:0;animation:npdGlowPulse 4.2s ease-in-out infinite alternate}
@keyframes npdGlowPulse{0%{transform:scale(.92);opacity:.65}100%{transform:scale(1.08);opacity:1}}
.npd-pl-particles{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden;contain:strict}
.npd-pl-particle{position:absolute;left:var(--x,50%);top:var(--y,50%);width:var(--s,3px);height:var(--s,3px);border-radius:50%;background:var(--c,#38BDF8);box-shadow:0 0 10px var(--c,#38BDF8);opacity:0;will-change:transform,opacity;animation:npdParticleFloat var(--d,7s) ease-in-out var(--dl,0s) infinite}
@keyframes npdParticleFloat{0%{transform:translate3d(0,18px,0) scale(.6);opacity:0}30%{opacity:var(--o,.65)}70%{opacity:var(--o,.65)}100%{transform:translate3d(var(--tx,14px),var(--ty,-64px),0) scale(1.1);opacity:0}}
.npd-pl-content{position:relative;z-index:2;width:min(500px,90vw);padding:34px 26px 30px;display:flex;flex-direction:column;align-items:center;text-align:center;background:rgba(11,17,32,.46);border:1px solid rgba(56,189,248,.16);border-radius:26px;box-shadow:0 26px 64px -20px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.08);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.npd-pl-content::before{content:"";position:absolute;top:-1px;left:18%;right:18%;height:1px;background:linear-gradient(90deg,transparent,rgba(56,189,248,.75),transparent)}
.npd-pl-logo-wrap{position:relative;width:136px;height:136px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;opacity:0;transform:scale(.7);filter:blur(10px);animation:npdLogoReveal .95s cubic-bezier(.22,1,.36,1) .08s forwards}
@keyframes npdLogoReveal{to{opacity:1;transform:scale(1);filter:blur(0)}}
.npd-pl-ring-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.npd-pl-ring-outer{transform-origin:50% 50%;animation:npdSpin 9s linear infinite}
.npd-pl-ring-inner{transform-origin:50% 50%;animation:npdSpinRev 14s linear infinite}
@keyframes npdSpin{to{transform:rotate(360deg)}}
@keyframes npdSpinRev{to{transform:rotate(-360deg)}}
.npd-pl-logo-box{position:relative;width:96px;height:96px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--pl-primary),var(--pl-secondary),var(--pl-accent));box-shadow:0 0 28px -4px rgba(6,182,212,.55),0 10px 26px -8px rgba(0,0,0,.85);overflow:hidden;transition:transform .5s var(--ease),filter .5s var(--ease);animation:npdLogoPulse 3s ease-in-out infinite}
@keyframes npdLogoPulse{0%,100%{box-shadow:0 0 24px -4px rgba(6,182,212,.5),0 0 0 0 rgba(56,189,248,0)}50%{box-shadow:0 0 36px 2px rgba(56,189,248,.75),0 0 0 6px rgba(56,189,248,.09)}}
.npd-pl-logo-inner{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--pl-bg-1);display:flex;align-items:center;justify-content:center}
.npd-pl-logo-img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block;border-radius:50%}
.npd-pl-monogram{display:none;font-weight:800;font-size:26px;letter-spacing:1.5px;background:linear-gradient(135deg,#FFFFFF 0%,var(--pl-accent) 55%,var(--pl-secondary) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.npd-pl-logo-box.is-fallback .npd-pl-logo-img{display:none}
.npd-pl-logo-box.is-fallback .npd-pl-monogram{display:block}
.npd-pl-logo-inner::after{content:"";position:absolute;top:-20%;left:-130%;width:75%;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),rgba(56,189,248,.35),transparent);transform:skewX(-25deg);pointer-events:none;animation:npdLightSweep 2.7s cubic-bezier(.4,0,.2,1) .55s infinite}
@keyframes npdLightSweep{0%{left:-130%}48%,100%{left:165%}}
.npd-pl-brand{margin:0 0 8px;font-size:clamp(21px,4.5vw,27px);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pl-text);line-height:1.25;display:flex;flex-wrap:wrap;justify-content:center;gap:.28em}
.npd-pl-word{display:inline-flex}
.npd-pl-char{display:inline-block;opacity:0;transform:translate3d(0,16px,0);animation:npdCharReveal .55s cubic-bezier(.22,1,.36,1) calc(var(--ci,0) * 32ms + 180ms) forwards}
.npd-pl-char.is-accent{background:linear-gradient(135deg,#FFFFFF 15%,var(--pl-accent) 60%,var(--pl-secondary) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes npdCharReveal{to{opacity:1;transform:translate3d(0,0,0)}}
.npd-pl-subtitle{margin:0 0 26px;font-family:var(--font-mono);font-size:clamp(10px,2.3vw,11.5px);font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--pl-muted);opacity:0;transform:translate3d(0,10px,0);animation:npdCharReveal .65s cubic-bezier(.22,1,.36,1) .55s forwards}
.npd-pl-subtitle .sep{color:var(--pl-secondary);margin:0 6px;font-weight:700}
.npd-pl-progress-wrap{width:100%;max-width:370px;opacity:0;transform:translate3d(0,12px,0);animation:npdCharReveal .65s cubic-bezier(.22,1,.36,1) .68s forwards}
.npd-pl-meta-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;font-family:var(--font-mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase}
.npd-pl-init{color:var(--pl-accent);font-weight:600;display:inline-flex;align-items:center;gap:7px}
.npd-pl-init-dot{width:6px;height:6px;border-radius:50%;background:var(--pl-secondary);box-shadow:0 0 8px var(--pl-secondary);animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite}
.npd-pl-pct-box{color:var(--pl-text);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.08em}
.npd-pl-pct-box .br{color:var(--pl-secondary);font-weight:500}
.npd-pl-pct-val{color:var(--pl-accent);text-shadow:0 0 12px rgba(56,189,248,.6)}
.npd-pl-bar{position:relative;width:100%;height:6px;border-radius:999px;background:rgba(148,163,184,.15);border:1px solid rgba(56,189,248,.16);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.npd-pl-progress-fill{position:relative;width:100%;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pl-primary) 0%,var(--pl-secondary) 55%,var(--pl-accent) 100%);box-shadow:0 0 16px rgba(6,182,212,.75);transform:scaleX(0);transform-origin:left center;will-change:transform;transition:box-shadow .3s ease}
.npd-pl-progress-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.78) 50%,transparent 100%);transform:translateX(-100%);animation:npdBarShimmer 1.35s linear infinite}
@keyframes npdBarShimmer{to{transform:translateX(100%)}}
.npd-pl-status-row{margin-top:14px;min-height:20px;display:flex;align-items:center;justify-content:center}
.npd-pl-status{font-family:var(--font-mono);font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--pl-muted);transition:opacity .2s ease,transform .2s ease,color .25s ease}
.npd-pl-status.is-switching{opacity:0;transform:translateY(4px)}
.npd-pl-status.is-welcome{color:var(--pl-accent);font-weight:700;letter-spacing:.26em;text-shadow:0 0 16px rgba(56,189,248,.8)}
html.is-preloading .site-header,html.is-preloading #main{opacity:0;transform:translate3d(0,16px,0)}
.site-header,#main{transition:opacity .75s cubic-bezier(.22,1,.36,1),transform .75s cubic-bezier(.22,1,.36,1)}
html.preloader-done .hero .badge-hello{animation:npdHeroItemIn .65s var(--ease) .05s both}
